name: Build ScyllaDB PHP extension
description: Configure, build, and install cassandra.so using CMake + Ninja

inputs:
  driver:
    required: false
    default: 'scylladb'
    description: 'Which driver: scylladb | cassandra | scylla-rust'
  cpp_driver_pkg_config_path:
    required: false
    default: ''
    description: 'PKG_CONFIG_PATH entry for the C++ driver. Only needed when the driver comes from the system'
  use_system_driver:
    required: false
    default: 'OFF'
    description: 'ON links the system driver via pkg-config; OFF builds the vendored third-party/cpp-driver (scylla-cpp backend only)'
  build_type:
    required: false
    default: 'RelWithDebInfo'
    description: 'CMake build type: Debug | RelWithDebInfo | Release'
  enable_lto:
    required: false
    default: 'OFF'
    description: 'Enable link-time optimisation'
  static_driver:
    required: false
    default: 'ON'
    description: 'Link the C++ driver statically (ON bundles it into the .so)'
  sanitize_address:
    required: false
    default: 'OFF'
    description: 'Build with AddressSanitizer (ON enables ENABLE_SANITIZERS + SANITIZE_ADDRESS)'
  enable_poll_api:
    required: false
    default: 'OFF'
    description: 'Io\\Poll integration (PHP >= 8.6): OFF | AUTO | ON (ON requires main/php_poll.h)'
  driver_version:
    required: false
    default: ''
    description: 'Version reported by phpversion(cassandra). Empty leaves the -dev snapshot version from CMakeLists.txt'

runs:
  using: composite
  steps:
    - name: Configure
      shell: bash
      run: |
        case "${{ inputs.driver }}" in
          cassandra)   BACKEND="cassandra"   ;;
          scylla-rust) BACKEND="scylla-rust" ;;
          scylladb|*)  BACKEND="scylla-cpp"  ;;
        esac

        export PKG_CONFIG_PATH="${{ inputs.cpp_driver_pkg_config_path }}:$(pkg-config --variable pc_path pkg-config 2>/dev/null || true)"

        LAUNCHER=()
        if command -v ccache >/dev/null 2>&1; then
          LAUNCHER=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
        fi

        cmake -G Ninja -B cmake-build \
          "${LAUNCHER[@]}" \
          -DCUSTOM_PHP_CONFIG="$(command -v php-config)" \
          -DCMAKE_BUILD_TYPE="${{ inputs.build_type }}" \
          -DPHP_SCYLLADB_STATIC="${{ inputs.static_driver }}" \
          -DPHP_SCYLLADB_BACKEND="${BACKEND}" \
          -DPHP_SCYLLADB_USE_SYSTEM_DRIVER="${{ inputs.use_system_driver }}" \
          -DENABLE_SANITIZERS="${{ inputs.sanitize_address }}" \
          -DSANITIZE_ADDRESS="${{ inputs.sanitize_address }}" \
          -DSANITIZE_UNDEFINED=OFF \
          -DPHP_SCYLLADB_ENABLE_POLL_API="${{ inputs.enable_poll_api }}" \
          -DPHP_SCYLLADB_DRIVER_VERSION="${{ inputs.driver_version }}" \
          -DENABLE_LTO="${{ inputs.enable_lto }}"

    - name: Build
      shell: bash
      run: cmake --build cmake-build --parallel "$(nproc 2>/dev/null || sysctl -n hw.logicalcpu)"

    # Regression guard for gh-117: cassandra.so must declare every native
    # library it uses (libgmp in particular) as a DT_NEEDED entry.
    #
    # A plain `php -d extension=cassandra -m` cannot catch a missing one:
    # PHP dlopen()s extensions RTLD_LAZY|RTLD_GLOBAL, so on glibc an unresolved
    # symbol is deferred until first call, and any earlier-loaded extension
    # (ext/gmp) donates its symbols to us. On musl there is no lazy binding, so
    # the identical .so fails outright at dlopen — which is how gh-117 surfaced
    # on Alpine while CI stayed green.
    #
    # Skipped under ASan: that build needs the ASan runtime LD_PRELOADed, which
    # the target does not set up.
    - name: Verify extension loads (isolated, eager binding)
      if: inputs.sanitize_address != 'ON'
      shell: bash
      run: cmake --build cmake-build --target verify-extension

    - name: Install extension
      shell: bash
      run: |
        SUDO=""; [[ "$(id -u)" -ne 0 ]] && SUDO="sudo"
        $SUDO cmake --install cmake-build --component extension
