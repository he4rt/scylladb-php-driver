name: "Test PHP Extension"

on:
  push:
    branches:
      - v1.3.x
    paths:
      - 'cmake/**'
      - 'src/**'
      - 'include/**'
      - 'util/**'
      - 'ZendCPP/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - '.github/workflows/test.yml'
      - '.github/actions/**'
  pull_request:
    branches:
      - v1.3.x
    paths:
      - 'cmake/**'
      - 'src/**'
      - 'include/**'
      - 'util/**'
      - 'ZendCPP/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - '.github/workflows/test.yml'
      - '.github/actions/**'

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}-${{ matrix.phpts }} / ${{ matrix.driver }}
    runs-on: ubuntu-24.04

    services:
      scylladb:
        image: scylladb/scylla:6.2
        options: >-
          --health-cmd "nodetool status 2>/dev/null | grep -q UN"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 30s
        ports:
          - 9042:9042

    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.3"
          - "8.4"
          - "8.5"
        phpts:
          - "nts"
          - "ts"
        driver:
          - "scylladb"
          - "cassandra"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            pkg-config build-essential

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-file: development
          coverage: none
          tools: none
        env:
          phpts: ${{ matrix.phpts }}
          debug: true

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.30"

      - uses: ./.github/actions/install-libuv
        id: libuv

      - uses: ./.github/actions/install-cpp-driver
        id: driver
        with:
          driver: ${{ matrix.driver }}
          libuv_pkg_config_path: ${{ steps.libuv.outputs.pkg_config_path }}

      - uses: ./.github/actions/build-extension
        with:
          driver: ${{ matrix.driver }}
          libuv_pkg_config_path: ${{ steps.libuv.outputs.pkg_config_path }}
          cpp_driver_pkg_config_path: ${{ steps.driver.outputs.pkg_config_path }}

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: tests/vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('tests/composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install Composer dependencies
        working-directory: tests
        run: |
          php -d extension=cassandra "$(command -v composer)" \
            install --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Run tests
        working-directory: tests
        run: |
          php -d extension=cassandra ./vendor/bin/pest \
            --colors=always \
            --fail-on-risky \
            --fail-on-warning \
            --fail-on-deprecation
        env:
          SCYLLADB_HOSTS: "127.0.0.1"
