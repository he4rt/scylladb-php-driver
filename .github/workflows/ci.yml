name: CI

on:
  push:
    branches:
      - v1.3.x
      - main
      - master
  pull_request:
    branches:
      - v1.3.x
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
