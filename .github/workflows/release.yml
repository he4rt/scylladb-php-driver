name: "Release"

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  tag:
    runs-on: ubuntu-24.04
    outputs:
      version:    ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.prerelease.outputs.is_prerelease || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Get Tag
        id: tag
        uses: olegtarasov/get-tag@v2.1.3
        with:
          tagRegex: "v(.*)"

      - name: Detect pre-release
        id: prerelease
        if: >
          contains(github.ref, '-rc') ||
          contains(github.ref, '-pre') ||
          contains(github.ref, '-alpha') ||
          contains(github.ref, '-beta')
        run: echo "is_prerelease=true" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.os }} / PHP ${{ matrix.php }}-${{ matrix.phpts }} / ${{ matrix.driver }}
    runs-on: ubuntu-24.04
    needs: [tag]
    strategy:
      fail-fast: true
      matrix:
        php:
          - "8.3"
          - "8.4"
          - "8.5"
        os:
          - "ubuntu-22.04"
          - "ubuntu-24.04"
        phpts:
          - "nts"
          - "ts"
        driver:
          - "scylladb"
          - "cassandra"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            pkg-config build-essential ninja-build

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-file: production
          coverage: none
          tools: none
        env:
          phpts: ${{ matrix.phpts }}

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.30"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: release-${{ runner.os }}-${{ matrix.php }}-${{ matrix.phpts }}-${{ matrix.driver }}
          restore-keys: |
            release-${{ runner.os }}-${{ matrix.php }}-${{ matrix.phpts }}-${{ matrix.driver }}
            release-${{ runner.os }}-${{ matrix.php }}-${{ matrix.phpts }}-
            release-${{ runner.os }}-${{ matrix.php }}-
          max-size: 500M
          append-timestamp: false

      - uses: ./.github/actions/install-libuv
        id: libuv

      - uses: ./.github/actions/install-cpp-driver
        id: driver
        with:
          driver: ${{ matrix.driver }}
          libuv_pkg_config_path: ${{ steps.libuv.outputs.pkg_config_path }}

      - uses: ./.github/actions/build-extension
        with:
          driver: ${{ matrix.driver }}
          libuv_pkg_config_path: ${{ steps.libuv.outputs.pkg_config_path }}
          cpp_driver_pkg_config_path: ${{ steps.driver.outputs.pkg_config_path }}
          build_type: Release
          enable_lto: ON

      - name: Package artifact
        run: |
          EXT_DIR="$(php-config --extension-dir)"
          ARTIFACT="${{ matrix.os }}-php${{ matrix.php }}-${{ matrix.phpts }}-${{ matrix.driver }}"
          cp "${EXT_DIR}/cassandra.so" .
          tar czf "${ARTIFACT}.tar.gz" cassandra.so cassandra.ini
          echo "ARTIFACT=${ARTIFACT}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.ARTIFACT }}.tar.gz
          if-no-files-found: error
          retention-days: 5
          overwrite: true

  release:
    runs-on: ubuntu-24.04
    needs: [build, tag]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        id: release
        with:
          make_latest: ${{ needs.tag.outputs.prerelease == 'false' }}
          name: "v${{ needs.tag.outputs.version }}"
          tag_name: "v${{ needs.tag.outputs.version }}"
          generate_release_notes: true
          append_body: true
          prerelease: ${{ needs.tag.outputs.prerelease == 'true' }}
          files: /tmp/artifacts/*.tar.gz
          fail_on_unmatched_files: true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: v1.3.x

      - name: Generate changelog
        uses: heinrichreimer/action-github-changelog-generator@v2.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          author: true
          releaseUrl: ${{ steps.release.outputs.url }}
          issues: true
          pullRequests: true

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update CHANGELOG.md"
          branch: v1.3.x
          commit_options: "--no-verify --signoff"
          file_pattern: CHANGELOG.md
