name: "Release"

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  tag:
    runs-on: ubuntu-26.04
    outputs:
      version:    ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.prerelease.outputs.is_prerelease || 'false' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Get Tag
        id: tag
        uses: olegtarasov/get-tag@45e6ac666e58c4737f7f0d22a2aabf67a7b36c0d # v2.1.3
        with:
          tagRegex: "v(.*)"

      - name: Detect pre-release
        id: prerelease
        if: >
          contains(github.ref, '-rc') ||
          contains(github.ref, '-pre') ||
          contains(github.ref, '-alpha') ||
          contains(github.ref, '-beta')
        run: echo "is_prerelease=true" >> "$GITHUB_OUTPUT"

      # The tag names the release, CMakeLists.txt names the version the code
      # reports through phpversion('cassandra'). Stop the release when the two
      # disagree, or the artifacts go out with the wrong version in them.
      - name: Check the tag against CMakeLists.txt
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          BASE="${TAG%%-*}"
          PROJECT="$(sed -n 's/^[[:space:]]*VERSION[[:space:]]\{1,\}\([0-9][0-9.]*\)[[:space:]]*$/\1/p' CMakeLists.txt | head -1)"

          if [ -z "$PROJECT" ]; then
            echo "::error::Could not read the project version from CMakeLists.txt"
            exit 1
          fi

          if [ "$BASE" != "$PROJECT" ]; then
            echo "::error::Tag v${TAG} does not match project(VERSION ${PROJECT}) in CMakeLists.txt. Bump CMakeLists.txt and retag."
            exit 1
          fi

          echo "Releasing ${TAG} from project version ${PROJECT}"

  build:
    name: ${{ matrix.os }} / PHP ${{ matrix.php }}-${{ matrix.phpts }} / ${{ matrix.driver }}
    runs-on: ubuntu-26.04
    needs: [tag]
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.3"
          - "8.4"
          - "8.5"
        os:
          - "ubuntu-22.04"
          - "ubuntu-24.04"
          - "ubuntu-26.04"
          - "ubuntu-26.04-arm"
        phpts:
          - "nts"
          - "ts"
        driver:
          - "scylladb"
          - "cassandra"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            pkg-config build-essential ninja-build libuv1-dev

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          ini-file: production
          coverage: none
          tools: none
        env:
          phpts: ${{ matrix.phpts }}

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2
        with:
          cmake-version: "3.30"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          key: release-${{ runner.os }}-${{ matrix.php }}-${{ matrix.phpts }}-${{ matrix.driver }}
          restore-keys: |
            release-${{ runner.os }}-${{ matrix.php }}-${{ matrix.phpts }}-${{ matrix.driver }}
            release-${{ runner.os }}-${{ matrix.php }}-${{ matrix.phpts }}-
            release-${{ runner.os }}-${{ matrix.php }}-
          max-size: 500M
          append-timestamp: false

      - uses: ./.github/actions/install-cpp-driver
        id: driver
        with:
          driver: ${{ matrix.driver }}

      - uses: ./.github/actions/build-extension
        with:
          driver: ${{ matrix.driver }}
          cpp_driver_pkg_config_path: ${{ steps.driver.outputs.pkg_config_path }}
          build_type: Release
          driver_version: ${{ needs.tag.outputs.version }}
          enable_lto: ON

      - name: Package artifact
        run: |
          EXT_DIR="$(php-config --extension-dir)"
          ARTIFACT="${{ matrix.os }}-php${{ matrix.php }}-${{ matrix.phpts }}-${{ matrix.driver }}"
          cp "${EXT_DIR}/cassandra.so" .
          tar czf "${ARTIFACT}.tar.gz" cassandra.so cassandra.ini
          echo "ARTIFACT=${ARTIFACT}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.ARTIFACT }}.tar.gz
          if-no-files-found: error
          retention-days: 5
          overwrite: true

  # Compile each PHP prefix once and put it in the cache. Without this stage the
  # build matrix below would compile the same PHP twice per (php, phpts, arch),
  # once for each driver, because both jobs start on an empty cache together.
  php-manylinux:
    name: PHP ${{ matrix.php }}-${{ matrix.phpts }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: [tag]
    container:
      image: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}:2026.08.08-1
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.3"
          - "8.4"
          - "8.5"
        arch:
          - "x86_64"
          - "aarch64"
        phpts:
          - "nts"
          - "ts"
        include:
          - arch: "x86_64"
            runner: "ubuntu-26.04"
          - arch: "aarch64"
            runner: "ubuntu-26.04-arm"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/build-php-source
        with:
          php: ${{ matrix.php }}
          phpts: ${{ matrix.phpts }}

  # Same reasoning for the C++ driver: six jobs share each (driver, arch) cache
  # entry and would otherwise all build it from source at the same time.
  driver-manylinux:
    name: ${{ matrix.driver }} driver / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: [tag]
    container:
      image: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}:2026.08.08-1
    env:
      CCACHE_DIR: /tmp/ccache
    strategy:
      fail-fast: false
      matrix:
        arch:
          - "x86_64"
          - "aarch64"
        driver:
          - "scylladb"
          - "cassandra"
        include:
          - arch: "x86_64"
            runner: "ubuntu-26.04"
          - arch: "aarch64"
            runner: "ubuntu-26.04-arm"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/install-cpp-driver
        with:
          driver: ${{ matrix.driver }}

  # Portable build for every other glibc distribution. The Ubuntu job above
  # links against the runner's glibc, so its artifacts only load on that
  # release or newer. manylinux_2_28 is AlmaLinux 8 with gcc-toolset-14: the
  # module needs glibc 2.28, which covers RHEL/Rocky/Alma 8+, Debian 10+,
  # Ubuntu 18.04+, openSUSE Leap 15.2+ and Amazon Linux 2023.
  build-manylinux:
    name: manylinux_2_28_${{ matrix.arch }} / PHP ${{ matrix.php }}-${{ matrix.phpts }} / ${{ matrix.driver }}
    runs-on: ${{ matrix.runner }}
    needs: [tag, php-manylinux, driver-manylinux]
    container:
      image: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}:2026.08.08-1
    env:
      # HOME is /github/home in a container job, so ccache's default location
      # moves with it. Pin it to keep the cache path and the tool in agreement.
      CCACHE_DIR: /tmp/ccache
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.3"
          - "8.4"
          - "8.5"
        arch:
          - "x86_64"
          - "aarch64"
        phpts:
          - "nts"
          - "ts"
        driver:
          - "scylladb"
          - "cassandra"
        include:
          - arch: "x86_64"
            runner: "ubuntu-26.04"
          - arch: "aarch64"
            runner: "ubuntu-26.04-arm"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          submodules: recursive

      # The image runs as root and ships no sudo. EPEL is already enabled and
      # provides ninja-build, ccache and libuv-devel.
      - name: Install system dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            ninja-build ccache pkgconf-pkg-config libuv-devel gmp-devel \
            binutils

      - name: Cache ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/ccache
          key: release-manylinux-${{ matrix.arch }}-${{ matrix.php }}-${{ matrix.phpts }}-${{ matrix.driver }}
          restore-keys: |
            release-manylinux-${{ matrix.arch }}-${{ matrix.php }}-${{ matrix.phpts }}-
            release-manylinux-${{ matrix.arch }}-${{ matrix.php }}-

      # setup-php has no AlmaLinux support, so PHP is compiled from source.
      - uses: ./.github/actions/build-php-source
        id: php
        with:
          php: ${{ matrix.php }}
          phpts: ${{ matrix.phpts }}

      - uses: ./.github/actions/install-cpp-driver
        id: driver
        with:
          driver: ${{ matrix.driver }}

      - uses: ./.github/actions/build-extension
        with:
          driver: ${{ matrix.driver }}
          cpp_driver_pkg_config_path: ${{ steps.driver.outputs.pkg_config_path }}
          build_type: Release
          driver_version: ${{ needs.tag.outputs.version }}
          enable_lto: ON

      # Guard the promise the artifact name makes. Without it a toolchain or
      # base-image bump raises the floor silently and the module stops loading
      # on the distributions this job exists to serve.
      - name: Verify manylinux_2_28 ABI floor
        run: |
          MODULE="$(php-config --extension-dir)/cassandra.so"

          # gcc-toolset-14 links against the RHEL 8 system libstdc++ and embeds
          # only the newer library parts statically, so a dynamic libstdc++
          # dependency is correct here. What matters is the version it asks for:
          # RHEL 8 provides GLIBCXX up to 3.4.25 and CXXABI up to 1.3.11.
          check_max() {
            local tag="$1" ceiling="$2" found
            found="$(objdump -T "$MODULE" \
              | grep -o "${tag}_[0-9][0-9.]*" | sed "s/${tag}_//" \
              | sort -V | tail -1 || true)"
            echo "highest referenced ${tag}: ${found:-none}"
            if [[ -n "$found" ]] \
               && [[ "$(printf '%s\n%s\n' "$found" "$ceiling" | sort -V | tail -1)" != "$ceiling" ]]; then
              echo "::error::module needs ${tag}_${found}, above the ${ceiling} floor"
              return 1
            fi
          }

          check_max GLIBC   2.28
          check_max GLIBCXX 3.4.25
          check_max CXXABI  1.3.11

          ldd "$MODULE"

      - name: Package artifact
        run: |
          EXT_DIR="$(php-config --extension-dir)"
          ARTIFACT="manylinux_2_28_${{ matrix.arch }}-php${{ matrix.php }}-${{ matrix.phpts }}-${{ matrix.driver }}"
          cp "${EXT_DIR}/cassandra.so" .
          tar czf "${ARTIFACT}.tar.gz" cassandra.so cassandra.ini
          echo "ARTIFACT=${ARTIFACT}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.ARTIFACT }}.tar.gz
          if-no-files-found: error
          retention-days: 5
          overwrite: true

  ide-stubs:
    name: IDE stubs
    runs-on: ubuntu-26.04
    needs: [tag]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            pkg-config build-essential ninja-build libuv1-dev

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          ini-file: production
          coverage: none
          tools: none

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2
        with:
          cmake-version: "3.30"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          key: release-ide-stubs-${{ runner.os }}-8.4
          max-size: 500M
          append-timestamp: false

      - uses: ./.github/actions/install-cpp-driver
        id: driver
        with:
          driver: scylladb

      # The generator resolves `@cvalue` constants out of a loaded extension,
      # so the stubs can only be produced against a real build.
      - uses: ./.github/actions/build-extension
        with:
          driver: scylladb
          cpp_driver_pkg_config_path: ${{ steps.driver.outputs.pkg_config_path }}
          build_type: Release
          driver_version: ${{ needs.tag.outputs.version }}
          enable_lto: OFF

      - name: Generate IDE stubs
        run: php -d extension=cassandra tools/gen_ide_stubs.php build/ide-stubs

      - name: Package IDE stubs
        run: |
          ARTIFACT="ide-stubs-v${{ needs.tag.outputs.version }}"
          tar czf "${ARTIFACT}.tar.gz" -C build ide-stubs
          echo "ARTIFACT=${ARTIFACT}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.ARTIFACT }}.tar.gz
          if-no-files-found: error
          retention-days: 5
          overwrite: true

  release:
    runs-on: ubuntu-26.04
    needs: [build, build-manylinux, ide-stubs, tag]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        id: release
        with:
          make_latest: ${{ needs.tag.outputs.prerelease == 'false' }}
          name: "v${{ needs.tag.outputs.version }}"
          tag_name: "v${{ needs.tag.outputs.version }}"
          generate_release_notes: true
          append_body: true
          prerelease: ${{ needs.tag.outputs.prerelease == 'true' }}
          files: /tmp/artifacts/*.tar.gz
          fail_on_unmatched_files: true

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          ref: v1.x

      - name: Generate changelog
        uses: heinrichreimer/action-github-changelog-generator@e60b5a2bd9fcd88dadf6345ff8327863fb8b490f # v2.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          author: true
          releaseUrl: ${{ steps.release.outputs.url }}
          issues: true
          pullRequests: true

      - uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: "chore: update CHANGELOG.md for ${{ needs.tag.outputs.version }}"
          branch: v1.x
          commit_options: "--no-verify --signoff"
          file_pattern: CHANGELOG.md

  # A released tag must equal project(VERSION), so the branch it came from has
  # to move on to the next version straight away. Otherwise its next snapshot
  # build reports the version that just shipped, and the tag guard above blocks
  # the next release. Pre-releases keep the same base version, so they skip this.
  bump:
    name: Open the next dev version
    runs-on: ubuntu-26.04
    needs: [release, tag]
    if: needs.tag.outputs.prerelease == 'false'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      # Releases come off a release branch (v1.x today, v2.x later) or off
      # trunk. Bump the branch that carries the tagged commit.
      - name: Find the released branch
        id: branch
        run: |
          BRANCH="$(git branch --remotes --contains "${{ github.sha }}" --format '%(refname:lstrip=3)' \
                    | grep -E '^(trunk|v[0-9]+\.x)$' | head -1)"

          if [ -z "$BRANCH" ]; then
            echo "::warning::Tag v${{ needs.tag.outputs.version }} is on no release branch, skipping the bump"
          fi

          echo "name=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Raise the patch version
        if: steps.branch.outputs.name != ''
        run: |
          git checkout "${{ steps.branch.outputs.name }}"

          CURRENT="$(sed -n 's/^[[:space:]]*VERSION[[:space:]]\{1,\}\([0-9][0-9.]*\)[[:space:]]*$/\1/p' CMakeLists.txt | head -1)"
          RELEASED="${{ needs.tag.outputs.version }}"

          if [ "$CURRENT" != "${RELEASED%%-*}" ]; then
            echo "${{ steps.branch.outputs.name }} is already on ${CURRENT}, released ${RELEASED} — nothing to bump"
            exit 0
          fi

          NEXT="$(echo "$CURRENT" | awk -F. '{ printf "%d.%d.%d", $1, $2, $3 + 1 }')"
          sed -i "0,/^\([[:space:]]*VERSION[[:space:]]\{1,\}\)${CURRENT}[[:space:]]*$/s//\1${NEXT}/" CMakeLists.txt

          echo "Bumped ${{ steps.branch.outputs.name }} from ${CURRENT} to ${NEXT}"
          git diff -- CMakeLists.txt

      - uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        if: steps.branch.outputs.name != ''
        with:
          commit_message: "chore: open the next development version after v${{ needs.tag.outputs.version }}"
          branch: ${{ steps.branch.outputs.name }}
          commit_options: "--no-verify --signoff"
          file_pattern: CMakeLists.txt
